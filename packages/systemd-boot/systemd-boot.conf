[boot]
enabled = true
# ESP mountpoint (must exist). Normally mounted automatically from /etc/fstab.
esp = /boot/efi
# Optional when /etc/fstab has no ESP entry: explicit source for auto-mount.
# esp_device = UUID=XXXX-XXXX
# Matches LPM's existing mkinitcpio kernel-install helper.
initrd = /boot/initrd-{version}.img
# Optional early microcode images, in boot order, separated by spaces.
microcode =
