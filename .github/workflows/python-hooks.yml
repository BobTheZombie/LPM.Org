name: Python bytecode hook regression

on:
  push:
    branches: [main]
    paths:
      - "usr/libexec/lpm/hooks/python-compileall"
      - "usr/libexec/lpm/hooks/_targets.py"
      - "tests/test_python_compileall_hook.py"
      - ".github/workflows/python-hooks.yml"
  pull_request:
    paths:
      - "usr/libexec/lpm/hooks/python-compileall"
      - "usr/libexec/lpm/hooks/_targets.py"
      - "tests/test_python_compileall_hook.py"
      - ".github/workflows/python-hooks.yml"

jobs:
  python-compileall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test Python compile hook
        run: python -m pytest -q tests/test_python_compileall_hook.py
