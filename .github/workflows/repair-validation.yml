name: repair-validation

on:
  push:
    branches:
      - codex/repair-runtime-buildchroot
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: lpm --help
      - run: pytest -q tests/test_lpmbuild_metadata_safety.py tests/test_buildgen_buildchroot.py tests/test_source_bootstrap.py
      - run: git clone --depth 1 https://gitlab.com/lpm-org/packages.git /tmp/lpm-packages
      - run: lpm buildgen --root /tmp/lpm-chroot --source /tmp/lpm-packages --output-dir /tmp/lpm-plan --verbose
