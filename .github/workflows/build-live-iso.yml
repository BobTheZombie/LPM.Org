name: Build LPM live ISO

on:
  workflow_dispatch:
    inputs:
      packages_ref:
        description: Packages repository branch or tag
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev python3-pip \
            xorriso grub-pc-bin grub-efi-amd64-bin squashfs-tools \
            bison flex gawk gettext texinfo meson ninja-build cmake pkg-config \
            rsync cpio fakeroot bubblewrap

      - name: Install LPM
        run: python3 -m pip install --break-system-packages .

      - name: Fetch package recipes
        run: |
          git clone --depth 1 --branch "${{ inputs.packages_ref }}" \
            https://gitlab.com/lpm-org/packages.git packages-source

      - name: Build root and ISO
        run: |
          sudo env PATH="$PATH" python3 -m lpm systemiso \
            --lpmbuild-root "$GITHUB_WORKSPACE/packages-source" \
            --package-profile "$GITHUB_WORKSPACE/packages-source/profiles/live-x86_64-v2.txt" \
            --root "$GITHUB_WORKSPACE/build/lpm-root" \
            --artifact-dir "$GITHUB_WORKSPACE/build/packages" \
            --iso-staging "$GITHUB_WORKSPACE/build/iso-staging" \
            --architecture x86_64-v2 \
            --hostname lpm-live \
            --volume-id LPM_LIVE \
            --output "$GITHUB_WORKSPACE/dist/lpm-live-x86_64-v2.iso"

      - name: Checksums
        run: sha256sum dist/lpm-live-x86_64-v2.iso > dist/lpm-live-x86_64-v2.iso.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: lpm-live-x86_64-v2
          path: |
            dist/lpm-live-x86_64-v2.iso
            dist/lpm-live-x86_64-v2.iso.sha256
            dist/lpm-live-x86_64-v2.iso.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
